services:
  rps-server:
    container_name: rps-server
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 2567
      MATCHMAKER_ALLOWED_ORIGINS: ${MATCHMAKER_ALLOWED_ORIGINS:?Set MATCHMAKER_ALLOWED_ORIGINS to the public web origin allowlist}
      MONITOR_USERNAME: ${MONITOR_USERNAME:-}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-}
    expose:
      - "2567"
    networks:
      - rps-shared-net
    restart: unless-stopped

networks:
  rps-shared-net:
    external: true
